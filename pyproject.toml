[project]
name = "pochettes-ar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["lent: appelle la vraie IA (Ollama), ~1 min ; lancer avec : uv run pytest -m lent"]
addopts = "-m 'not lent'"
